        <script>
  // On sélectionne la barre de recherche
  const inputRecherche = document.getElementById('barreRecherche');
  
  // On récupère TOUTES les images de la galerie d'un coup
  const toutesLesImages = document.querySelectorAll('.galerie img');

  // On écoute ce que l'utilisateur tape dans la barre
  inputRecherche.addEventListener('input', (evenement) => {
    const texteSaisi = evenement.target.value.toLowerCase();

    // On parcourt chaque image présente dans le HTML
    toutesLesImages.forEach(image => {
      const idImage = image.id.toLowerCase();

      // Si l'ID de l'image contient le texte tapé, on l'affiche, sinon on la cache
      if (idImage.includes(texteSaisi)) {
        image.style.display = 'inline-block'; // Réaffiche l'image
      } else {
        image.style.display = 'none'; // Cache l'image
      }
    });
  });
</script>
