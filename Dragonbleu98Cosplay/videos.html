<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Dragonbleu98Cosplay/src/img/logo2.2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Galerie photos des conventions cosplay de DragonBleu98." />
    <title>DragonBleu98 - Galerie Conventions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100 font-sans min-h-screen pb-10">

    <!-- Header -->
    <header class="flex flex-col items-center py-10 px-4">
        <div class="w-full md:w-1/2 bg-gray-300 rounded-2xl md:rounded-full p-6 text-center shadow-xl">
            <h1 class="text-2xl font-bold mb-4">Photos des conventions</h1>
            <img src="src/img/DragonBleu98-logoV2.png" alt="Logo" class="w-[200px] mx-auto rounded-full">
        </div>
    </header>

    <!-- Galerie Générale -->
    <main class="max-w-5xl mx-auto px-4">

        <!-- ANNÉE 2021 -->
        <section class="mb-12">
            <h2 class="text-3xl font-bold text-blue-900 border-b-4 border-blue-300 mb-6 pb-2">Année 2021</h2>
            
            <h3 class="text-xl font-bold mb-3">Made in Asia 2021</h3> 
            <div class="bg-white p-4 rounded-lg shadow-md grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                <!-- Ajout de controls pour pouvoir lire la vidéo -->
                <video src="src/videos/catalklusifa1.mp4" controls class="w-full h-64 object-cover bg-gray-200 rounded"></video>         
            </div>
            
            <h3 class="text-xl font-bold mb-3">Conventions 2023 (Aperçu)</h3>
            <div class="bg-white p-4 rounded-lg shadow-md grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                <img src="/src/img/cosplay/***" alt="James" class="w-full h-64 object-cover bg-gray-200 rounded">
            </div>
        </section>

        <!-- ANNÉE 2022 -->
        <section class="mb-12">
            <h2 class="text-3xl font-bold text-blue-900 border-b-4 border-blue-300 mb-6 pb-2">Année 2022</h2>

            <div class="bg-white p-4 rounded-lg shadow-md grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-6">

            </div>
